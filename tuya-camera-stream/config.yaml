name: "M.A.I Camera"
version: "1.0.20"
slug: "mai_camera"
description: "Stream Cameras as local RTSP via tuya-ipc-terminal and provide Assist Camera features."
url: "https://github.com/manhvuarchitect/M.A.I_Camera"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: false
host_network: false
ports:
  8554/tcp: 8554
ports_description:
  8554/tcp: "RTSP stream server"
options:
  region: "us-west"
  email: ""
  auth_method: "qr"
  rtsp_port: 8554
  log_level: "info"
schema:
  region: "list(eu-central|eu-east|us-west|us-east|china|india)"
  email: "str"
  auth_method: "list(qr|password)"
  rtsp_port: "int"
  log_level: "list(debug|info|warning|error)"
map:
  - data:rw
panel_icon: mdi:cctv
panel_title: "M.A.I Camera"

